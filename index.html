<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DJ Analyzer Pro - Smart Mix</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
    
    <link rel="manifest" href="manifest.json">
</head>
<body>
    <div class="glow"></div>
    <div class="container">
        <header>
            <h1>DJ <span class="highlight">Analyzer</span></h1>
            <p>Carica cartelle, analizza e crea il set armonico perfetto</p>
        </header>
        
        <div class="input-container">
            <div id="drop-zone" class="drop-zone">
                <div class="icon">📁</div>
                <p>Trascina file qui o clicca per singoli file</p>
                <input type="file" id="file-input" accept="audio/*" hidden multiple>
            </div>
            
            <button id="folder-btn" class="folder-btn">📂 Carica Intera Cartella</button>
            <input type="file" id="folder-input" webkitdirectory directory hidden>
        </div>

        <div id="loader" class="hidden">
            <div class="spinner"></div>
            <p id="loader-text">Analizzando...</p>
        </div>

        <div id="results-container" class="hidden">
            <div class="controls">
                <div class="sort-group">
                    <button onclick="sortTracks('bpm')">BPM ⬆⬇</button>
                    <button onclick="sortTracks('camelot')">Camelot ⬆⬇</button>
                </div>
                <div class="action-group">
                    <button onclick="smartMix()" class="highlight-btn">✨ Smart Mix</button>
                    <button onclick="exportPDF()" class="pdf-btn">📄 Scarica PDF</button>
                </div>
            </div>
            
            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>Titolo</th>
                            <th>BPM</th>
                            <th>Key</th>
                            <th>Camelot</th>
                        </tr>
                    </thead>
                    <tbody id="tracks-body"></tbody>
                </table>
            </div>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>

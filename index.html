<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DJ Analyzer Pro - Multi</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="manifest" href="manifest.json">
</head>
<body>
    <div class="glow"></div>
    <div class="container">
        <header>
            <h1>DJ <span class="highlight">Analyzer</span></h1>
            <p>Carica le tue tracce e ordinale per il mix perfetto</p>
        </header>
        
        <div id="drop-zone" class="drop-zone">
            <div class="icon">📁</div>
            <input type="file" id="file-input" accept="audio/*" hidden multiple>
            <label for="file-input">Trascina i file o <span class="browse">sfoglia</span></label>
        </div>

        <div id="loader" class="hidden">
            <div class="spinner"></div>
            <p id="loader-text">Analizzando...</p>
        </div>

        <div id="results-container" class="hidden">
            <div class="controls">
                <button onclick="sortTracks('bpm')">Ordina per BPM</button>
                <button onclick="sortTracks('camelot')">Ordina per Camelot</button>
            </div>
            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>Titolo</th>
                            <th>BPM</th>
                            <th>Key</th>
                            <th>Camelot</th>
                        </tr>
                    </thead>
                    <tbody id="tracks-body"></tbody>
                </table>
            </div>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
